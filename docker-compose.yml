services:
  postgres:
    image: postgres:16-alpine
    container_name: myproduct-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: myproduct
      POSTGRES_PASSWORD: myproduct
      POSTGRES_DB: myproduct
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
